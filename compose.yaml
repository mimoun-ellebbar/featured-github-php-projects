
services:
###> doctrine/doctrine-bundle ###
  database:
    container_name: symfony_mariadb
    image: mariadb:10.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-symfony_app}
      MYSQL_USER: ${DB_USER:-symfony}
      MYSQL_PASSWORD: ${DB_PASSWORD:-symfony}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql:rw
    ports:
      - "${MAPPED_DB_PORT:-3306}:3306"
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/mysql:rw
###< doctrine/doctrine-bundle ###

  php:
    container_name: symfony_php
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:cached
      - php_vendor:/var/www/html/vendor
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 40s
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - APP_SECRET=${APP_SECRET:-change_me_to_random_secret}
      - DB_VERSION=${DB_VERSION:-mariadb-10.4}
      - DATABASE_URL=mysql://${DB_USER:-symfony}:${DB_PASSWORD:-symfony}@database:3306/${DB_DATABASE:-symfony_app}?serverVersion=${DB_VERSION:-10.4.34-mariadb}
      - XDEBUG_MODE=${XDEBUG_MODE:-off}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    container_name: symfony_nginx
    image: nginx:stable-alpine
    restart: unless-stopped
    environment:
      - ENV_NGINX_PORT=${NGINX_PORT:-8080}
    ports:
      - "${ENV_NGINX_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
  php_vendor:
